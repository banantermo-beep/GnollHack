name: Build Android APK
on: [workflow_dispatch] # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: windows-latest # Для сборки .NET MAUI Android нужна Windows-среда

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Последние версии GnollHack требуют .NET 10

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Android APK
      run: dotnet publish -c Release -f net10.0-android /p:AndroidBuildApplicationPackage=true /p:AndroidPackageFormat=apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gnollhack-android-apk
        path: |
          **/bin/Release/net10.0-android/publish/*.apk
          **/bin/Release/net10.0-android/*.apk
          
